<!DOCTYPE html>
<html lang="en" class="theme-light" data-section="{{sectionKey}}" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{pageTitle}}</title>
    <meta name="description" content="{{metaDescription}}" />
    <meta name="author" content="Vishnu P Rajagopal" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="{{canonicalUrl}}" />
    <meta property="og:title" content="{{pageTitle}}" />
    <meta property="og:description" content="{{metaDescription}}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{canonicalUrl}}" />
    <meta property="og:image" content="https://www.vishnuprajagopal.com/assets/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{pageTitle}}" />
    <meta name="twitter:description" content="{{metaDescription}}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var userSelectedTheme = sessionStorage.getItem('themeUserSelected') === 'true';
          var systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = userSelectedTheme ? savedTheme === 'dark' : systemPrefersDark;

          if (!userSelectedTheme && savedTheme === 'dark') {
            localStorage.removeItem('theme');
          }

          var root = document.documentElement;
          root.setAttribute('data-theme', isDark ? 'dark' : 'light');
          root.classList.toggle('dark', isDark);
          root.classList.toggle('theme-dark', isDark);
        } catch (error) {}
      })();
    </script>
    <link rel="stylesheet" href="/css/style.css" />
    <script type="application/ld+json">
      {{personSchema}}
    </script>
    <script type="application/ld+json">
      {{pageJsonLd}}
    </script>
  </head>
  <body class="{{bodyClass}}">
    <div class="loading-screen" aria-hidden="true">
      <div class="loading-screen__word">explore.</div>
      <div class="loading-screen__cursor"></div>
    </div>

    <div class="page-frame">
      <header class="site-header">
        <nav class="site-nav" aria-label="Main navigation">
          <div class="nav-links">
            <div class="nav-dropdown">
              <a href="/blog" class="nav-trigger" aria-expanded="false" aria-controls="blog-menu">
                <span>Blog</span>
                <span class="nav-caret">▾</span>
              </a>
              <div id="blog-menu" class="dropdown-menu" role="menu">
                <a href="/blog" role="menuitem">Explore the blog</a>
                <a href="/blog/learnings" role="menuitem">Ledger</a>
                <a href="/blog/letters" role="menuitem">Epiphanies</a>
                <a href="/projects" role="menuitem">Blueprints</a>
              </div>
            </div>
            <a href="/about">About</a>
          </div>

          <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
            <span class="theme-toggle__icon">◐</span>
          </button>
        </nav>
      </header>

      <main class="site-main">
        {{pageContent}}
      </main>

      <footer class="site-footer">
        <div class="footer-inner">
          <div class="footer-links">
            <a href="https://linkedin.com/in/vishnu-p-rajagopal-585b8b216" target="_blank" rel="noreferrer">Connect</a>
            <a href="https://github.com/Vishnudrm" target="_blank" rel="noreferrer">GitHub</a>
            <a href="https://linkedin.com/in/vishnu-p-rajagopal-585b8b216" target="_blank" rel="noreferrer">LinkedIn</a>
          </div>
          <span class="footer-copy">© {{currentYear}}</span>
        </div>
      </footer>
    </div>

    <script defer src="/js/main.js"></script>
  </body>
</html>
