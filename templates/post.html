<article class="post-article reveal">
  <header class="article-header">
    <p class="section-label section-label--{{sectionLabel}}">{{sectionLabel}}</p>
    <h1>{{postTitle}}</h1>
    <div class="article-meta">
      <span>{{postDate}}</span>
      <span>{{readingTime}}</span>
      <span>{{category}}</span>
    </div>
  </header>

  <div class="article-body">
    {{articleBody}}
  </div>

  <footer class="article-footer">
    <p>Tags</p>
    <ul class="tag-list">
      {{tags}}
    </ul>
  </footer>
</article>
